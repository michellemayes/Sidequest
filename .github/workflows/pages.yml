name: Site

# Publishes the marketing page (site/) to GitHub Pages. Needs Pages turned on
# once, with Settings › Pages › Source set to "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - site/**
      - assets/icon.svg
      - docs/demo/demo.gif
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: site/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
